<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- 1. Studio Logo -->
  <symbol id="icon-studio-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="13" rx="2.5" />
    <path d="M10 8.5l5 3-5 3v-6z" fill="currentColor" />
    <path d="M8 21h8m-4-4v4" />
  </symbol>

  <!-- 2. Presentation Slide Deck -->
  <symbol id="icon-slide-deck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="13" rx="2" />
    <path d="M7 8h10M7 11h6" />
    <path d="M9 20h6m-3-3v3" />
  </symbol>

  <!-- 3. Voice Neural Microphone -->
  <symbol id="icon-voice-wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="3" width="6" height="10" rx="3" />
    <path d="M5 10a7 7 0 0014 0" />
    <path d="M12 17v4m-3 0h6" />
  </symbol>

  <!-- 4. Speech Cadence / Speed Meter -->
  <symbol id="icon-speech-meter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 16.5A8 8 0 1119.5 16.5" />
    <path d="M12 12l3.5-3.5" />
    <circle cx="12" cy="12" r="1.5" fill="currentColor" />
  </symbol>

  <!-- 5. Slide Transition & Pause -->
  <symbol id="icon-slide-pause" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="14" rx="2" />
    <path d="M10 9v4m4-4v4" />
    <path d="M3 18h18" opacity="0.3" />
  </symbol>

  <!-- 6. Settings / Tuning Sliders -->
  <symbol id="icon-settings-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6h9m4 0h3M13 4v4M4 12h3m4 0h9M7 10v4M4 18h11m4 0h1M15 16v4" />
  </symbol>

  <!-- 7. Magic 1-Click Wand -->
  <symbol id="icon-wand-magic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 9l5.5-5.5M15 9l-9 9a2.12 2.12 0 01-3-3l9-9m3 3l-3-3" />
    <path d="M11.5 3.5l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5.5-1.5zM6 8l.3 1 1 .3-1 .3-.3 1-.3-1-1-.3 1-.3.3-1z" />
  </symbol>

  <!-- 8. Script Editor -->
  <symbol id="icon-script-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z" />
    <path d="M14 3v6h6" />
    <path d="M8 13h8M8 17h5" />
  </symbol>

  <!-- 9. Video Display Screen -->
  <symbol id="icon-video-screen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2.5" />
    <path d="M10 8.5l5 3-5 3v-6z" fill="currentColor" />
    <path d="M8 20h8m-4-3v3" />
  </symbol>

  <!-- 10. Pipeline Step 1: Extract Slides -->
  <symbol id="icon-step-extract" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3L2 8l10 5 10-5-10-5z" />
    <path d="M2 12l10 5 10-5" />
    <path d="M2 16l10 5 10-5" />
  </symbol>

  <!-- 11. Pipeline Step 2: AI Script Gen -->
  <symbol id="icon-step-script" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="5" width="14" height="14" rx="2.5" />
    <path d="M9 9h6M9 12h6M9 15h4" />
    <path d="M1 9h4M1 15h4M19 9h4M19 15h4M9 1v4M15 1v4M9 19v4M15 19v4" />
  </symbol>

  <!-- 12. Pipeline Step 3: Neural TTS Audio -->
  <symbol id="icon-step-tts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12h2M7 8v8M10 5v14M13 3v18M16 7v10M19 9v6M21 12h2" />
  </symbol>

  <!-- 13. Pipeline Step 4: Voice Cloning / Optimization -->
  <symbol id="icon-step-clone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 14a8 8 0 0116 0" />
    <path d="M7 14a5 5 0 0110 0" />
    <path d="M10 14a2 2 0 014 0" />
    <path d="M12 14v6m-4 0h8" />
  </symbol>

  <!-- 14. Pipeline Step 5: Render 1080p MP4 -->
  <symbol id="icon-step-render" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2.5" />
    <path d="M7 5v14M17 5v14M3 9.5h4M17 9.5h4M3 14.5h4M17 14.5h4" />
  </symbol>

  <!-- 15. Console Terminal -->
  <symbol id="icon-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="16" rx="2" />
    <path d="M7 9l3 3-3 3M13 15h4" />
  </symbol>

  <!-- 16. Download Video File -->
  <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v12m0 0l-4-4m4 4l4-4" />
    <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" />
  </symbol>

  <!-- 17. Refresh Action -->
  <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4v5h5M20 20v-5h-5M4.93 15a8 8 0 0013.14 2.14L20 15M19.07 9A8 8 0 005.93 6.86L4 9" />
  </symbol>

  <!-- 18. Status Checkmark (Success) -->
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 6L9 17l-5-5" />
  </symbol>

  <!-- 19. Status Alert (Warning) -->
  <symbol id="icon-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" />
  </symbol>

  <!-- 20. Status Error (Circle Cross) -->
  <symbol id="icon-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9" />
    <path d="M15 9l-6 6M9 9l6 6" />
  </symbol>

  <!-- 21. Status Info (Circle Info) -->
  <symbol id="icon-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9" />
    <path d="M12 11v5m0-8h.01" />
  </symbol>

  <!-- 22. Close / Dismiss -->
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 18L18 6M6 6l12 12" />
  </symbol>

  <!-- 23. Chevron Down -->
  <symbol id="icon-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 9l-7 7-7-7" />
  </symbol>

  <!-- 24. Eye (Visible) -->
  <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
    <circle cx="12" cy="12" r="3" />
  </symbol>

  <!-- 25. Eye Off (Hidden) -->
  <symbol id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24M1 1l22 22" />
  </symbol>
</svg>
